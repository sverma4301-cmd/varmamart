<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Verma Mart</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .form-box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; border: 1px solid #48dbfb; }
        input { display: block; width: 300px; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #48dbfb; color: black; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <h1>Add New Product</h1>
    <div class="form-box">
        <input type="text" id="pName" placeholder="Product Name (e.g. Stylish Shoes)">
        <input type="text" id="pPrice" placeholder="Price (e.g. 999)">
        <input type="text" id="pImg" placeholder="Image URL (Link copy karke dalo)">
        <button onclick="addProduct()">Website Pe Daalo</button>
    </div>

    <script>
        function addProduct() {
            alert("Bhai, abhi hume Firebase connect karna hai! Pehle setup check kar lo.");
        }
    </script>
</body>
</html>
