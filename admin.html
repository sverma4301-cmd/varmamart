<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Verma Lifestyle & Mart</title>
</head>
<body>
    <div class="header">Verma Lifestyle & Mart</div>
    <div class="container" id="product-container">
        <p>Dukan Saj rahi hai, thoda ruko...</p>
    </div>

    <script>
        // GOOGLE SHEET KA "PUBLISH TO WEB" WALA CSV LINK YAHAN DALO
        const sheetURL = 'TUMHARA_CSV_LINK_YAHAN_PASTE_KARO';

        async function loadProducts() {
            try {
                const res = await fetch(sheetURL);
                const data = await res.text();
                const rows = data.split('\n').slice(1); 
                const container = document.getElementById('product-container');
                container.innerHTML = '';

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length >= 5) {
                        const name = cols[0];
                        const price = cols[1];
                        const img = cols[2];
                        const desc = cols[3];
                        const rating = parseInt(cols[4]);

                        let stars = '';
                        for(let i=0; i<5; i++) {
                            stars += i < rating ? '⭐' : '☆';
                        }

                        container.innerHTML += `
                            <div class="card">
                                <img src="${img}" alt="${name}">
                                <div class="rating">${stars}</div>
                                <h3>${name}</h3>
                                <p class="desc">${desc}</p>
                                <p class="price">₹${price}</p>
                                <a href="https://wa.me/91XXXXXXXXXX?text=Order:${name}" class="buy-btn">WhatsApp Order</a>
                            </div>`;
                    }
                });
            } catch (e) {
                console.log("Error loading data");
            }
        }
        loadProducts();
    </script>
</body>
</html>
